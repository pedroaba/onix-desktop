[project]
name = "onedrive-desktop"
version = "0.1.0"
license = "MIT"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyobjc-framework-cocoa>=13.0 ; sys_platform == 'darwin'",
    "pyside6>=6.12.0",
    "rich>=15.0.0",
]

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
stubPath = "typings"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["assets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ruff>=0.17.3",
]
